name: Docs

# Builds the Quarkdown site in docs/ and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but a
# deployment already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarkdown-labs/setup-quarkdown@v1
        with:
          quarkdown-version: '2.6.4'
      - run: quarkdown c main.qd --strict --clean -o "$RUNNER_TEMP/site"
        working-directory: docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site/gol-bevy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
