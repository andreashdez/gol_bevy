name: CI

# Branches run through their pull request, so a push to one doesn't run
# everything twice. Main and release tags run on push.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Jobs only read the repository; the release job asks for more itself.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run in progress.
# A release tag's run always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # System libraries Bevy builds and links against on Linux.
  LINUX_DEPS: pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
  # The newest glibc the Linux release may need, as promised in docs/install.qd.
  # Debian bookworm, the build image, has exactly this one.
  GLIBC_MAX: '2.36'

# Actions are pinned to a commit, with the release it is in as a comment, so a
# moved or compromised tag cannot change what runs here. Checkouts keep no
# credentials, as no job pushes with git.
#
# Lint and test jobs cache their builds, saved from main only. The release jobs
# build from scratch, so nothing a cache holds can reach a published binary.
jobs:
  fmt:
    runs-on: ubuntu-latest
    # Matches rust-toolchain.toml, so rustup finds the pinned toolchain already
    # installed. The Debian release is pinned too: it sets the oldest glibc the
    # Linux release build runs on.
    container: rust:1.100.0-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Caches saved elsewhere can't be restored on main, and crowd out its own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # The web build, for the demo on the docs site, compiles without native file
  # dialogs or settings files, so it is linted on its own.
  clippy-web:
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

  # Code behind Windows-only cfgs, such as the file handling in atomic_file.rs,
  # would otherwise first compile when a release is tagged.
  clippy-windows:
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - run: rustup component add clippy && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --target x86_64-pc-windows-gnu --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-targets --all-features --locked

  # The tests again on macOS, where file paths, the clipboard, and the Cmd key
  # take other code paths than on Linux.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-targets --all-features --locked

  # And on Windows, where replacing a saved file and finding the settings
  # folder take other code paths again.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-targets --all-features --locked

  # A tag must match the version in Cargo.toml before anything is built for it.
  version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

  # Release builds run only for tags, once every lint, test, and the version check
  # have passed.
  release-linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [fmt, clippy, clippy-web, clippy-windows, test, test-macos, test-windows, version]
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    env:
      # Symbols are a third of the binary; local release builds keep them for profiling.
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - run: cargo build --release --locked
      # A dependency update can raise the glibc a binary needs without anyone
      # noticing, until it won't start on a system the docs say it supports.
      - name: Check the glibc the binary needs
        run: |
          needed=$(objdump -T target/release/gol-bevy | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "The binary needs glibc $needed; at most $GLIBC_MAX is allowed."
          [ "$(printf '%s\n%s\n' "$needed" "$GLIBC_MAX" | sort -V | tail -n 1)" = "$GLIBC_MAX" ]
      - run: scripts/package-release.sh "gol-bevy-$GITHUB_REF_NAME-x86_64-linux" target/release/gol-bevy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*.tar.gz

  # Cross-compiled with MinGW, so it needs no Windows runner.
  release-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [fmt, clippy, clippy-web, clippy-windows, test, test-macos, test-windows, version]
    runs-on: ubuntu-latest
    container: rust:1.100.0-bookworm
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - run: cargo build --release --locked --target x86_64-pc-windows-gnu
      - run: scripts/package-release.sh "gol-bevy-$GITHUB_REF_NAME-x86_64-windows" target/x86_64-pc-windows-gnu/release/gol-bevy.exe zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*.zip

  # Universal (Apple silicon + Intel) binary, built by the same recipe as local
  # macOS release builds.
  release-macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [fmt, clippy, clippy-web, clippy-windows, test, test-macos, test-windows, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just,cargo-about
      - run: just release-macos "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*.tar.gz

  release:
    needs: [release-linux, release-windows, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The binaries are unsigned, so checksums are the way to tell a download
      # is the one CI built.
      - run: cd dist && sha256sum -- * > SHA256SUMS
      # The notes are the version's section of CHANGELOG.md.
      - run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "gol-bevy $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
