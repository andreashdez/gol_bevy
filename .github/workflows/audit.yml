name: Audit

# Checks the crates in Cargo.lock against the RustSec advisory database: when
# they change, and every week, as advisories also appear for crates already in
# use. It runs apart from CI, so a new advisory for a crate deep in Bevy shows
# up here without holding back unrelated changes or a release.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the release it is in as a comment.
jobs:
  advisories:
    runs-on: ubuntu-latest
    # Matches rust-toolchain.toml, as in CI.
    container: rust:1.100.0-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories
