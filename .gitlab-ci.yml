image: rust:latest

stages:
  - lint
  - test

variables:
  CARGO_TERM_COLOR: always

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/
    - /usr/local/cargo/registry/
    - /usr/local/cargo/git/

default:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
    - rm -rf /var/lib/apt/lists/*
    - rustup component add rustfmt clippy

fmt:
  stage: lint
  script:
    - cargo fmt --all -- --check

clippy:
  stage: lint
  script:
    - cargo clippy --all-targets --all-features -- -D warnings

test:
  stage: test
  script:
    - cargo test --all-targets --all-features --locked
    - cargo test readme_contains_controls_text --locked
