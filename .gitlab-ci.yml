image: rust:latest

stages:
  - lint
  - test

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/
    - .cargo/registry/
    - .cargo/git/

default:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
    - rm -rf /var/lib/apt/lists/*
    - rustup component add rustfmt clippy

fmt:
  stage: lint
  script:
    - cargo fmt --all -- --check

clippy:
  stage: lint
  script:
    - cargo clippy --all-targets --all-features --locked -- -D warnings

test:
  stage: test
  script:
    - cargo test --all-targets --all-features --locked
