# Matches rust-toolchain.toml, so rustup finds the pinned toolchain already
# installed. The Debian release is pinned too: it sets the oldest glibc the
# Linux release build runs on.
image: rust:1.99.0-trixie

stages:
  - lint
  - test
  - build
  - release

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - target/
    - .cargo/registry/
    - .cargo/git/

# System libraries Bevy builds and links against on Linux.
.linux-deps: &linux-deps
  - apt-get update
  - apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
  - rm -rf /var/lib/apt/lists/*

default:
  before_script:
    - *linux-deps
    - rustup component add rustfmt clippy

fmt:
  stage: lint
  script:
    - cargo fmt --all -- --check

clippy:
  stage: lint
  script:
    - cargo clippy --all-targets --all-features --locked -- -D warnings

test:
  stage: test
  script:
    - cargo test --all-targets --all-features --locked

# Release builds run only for tags, once lint and tests have passed. The macOS
# build needs an Apple machine, so it is made with `just release-macos` instead.
.release-build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Symbols are a third of the binary; local release builds keep them for profiling.
    CARGO_PROFILE_RELEASE_STRIP: symbols
  artifacts:
    paths:
      - dist/
    # The release page links to these, so they must outlive the default expiry.
    expire_in: never

release-linux:
  extends: .release-build
  before_script:
    - *linux-deps
  script:
    - cargo build --release --locked
    - scripts/package-release.sh "gol-bevy-$CI_COMMIT_TAG-x86_64-linux" target/release/gol-bevy

# Cross-compiled with MinGW, so it needs no Windows runner.
release-windows:
  extends: .release-build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip
    - rm -rf /var/lib/apt/lists/*
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo build --release --locked --target x86_64-pc-windows-gnu
    - scripts/package-release.sh "gol-bevy-$CI_COMMIT_TAG-x86_64-windows" target/x86_64-pc-windows-gnu/release/gol-bevy.exe zip

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release-linux
      artifacts: false
    - job: release-windows
      artifacts: false
  cache: []
  before_script: []
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "gol-bevy $CI_COMMIT_TAG"
    description: "Built from $CI_COMMIT_SHA. Download the archive for your platform, unpack it, and run gol-bevy. The macOS build is attached separately."
    assets:
      links:
        - name: "Linux x86_64 (tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/gol-bevy-$CI_COMMIT_TAG-x86_64-linux.tar.gz?job=release-linux"
          link_type: package
        - name: "Windows x86_64 (zip)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/gol-bevy-$CI_COMMIT_TAG-x86_64-windows.zip?job=release-windows"
          link_type: package
