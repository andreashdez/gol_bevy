[package]
name = "gol-bevy"
version = "0.3.0"
edition = "2024"
description = "Conway's Game of Life as a desktop app, built on Bevy"
license = "MIT"
repository = "https://github.com/andreashdez/gol_bevy"
homepage = "https://andreashdez.github.io/gol_bevy/"
# Matches rust-toolchain.toml, for anyone building with another toolchain.
rust-version = "1.100"
# An app, not a library: nothing to publish to crates.io.
publish = false

[dependencies]
accesskit = "0.24"
# Bevy's `2d`/`ui` collections also bring gamepads (gilrs, which needs libudev
# on Linux), scenes, animation, picking backends and image decoders this app
# never uses, so it lists only the parts it does.
bevy = { version = "0.20", default-features = false, features = [
    # App runtime: multithreaded schedules, the task pools and logging.
    "async_executor",
    "multi_threaded",
    "bevy_log",
    # `Assets<Image>`/`Assets<Font>`; textures are built in code and the font is
    # embedded, so no image decoders are needed.
    "bevy_asset",
    # Windowing (with the accesskit adapter) on X11 and Wayland.
    "bevy_winit",
    "x11",
    "wayland",
    # Rendering: the 2D camera, the board and stamp sprites, and gizmo overlays.
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    # The UI: nodes and text, sliders and scrollbars, tab focus, and pointer
    # input on UI nodes.
    "bevy_ui_render",
    "bevy_ui_widgets",
    "ui_picking",
    # Text inputs that set no font fall back to Bevy's built-in one.
    "default_font",
    # Copy and paste in the text inputs, through the OS clipboard.
    "system_clipboard",
] }
dirs = "7"
fastrand = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Native file dialogs; the web build has no file system, so it leaves them out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"

# The web build, for the demo on the docs site. `web` gives Bevy browser clocks
# and task executors, `webgl2` renders through WebGL2, and `js` seeds random
# boards from the browser instead of a fixed seed. web-sys, already in the tree
# through Bevy, asks the browser whether it runs on a Mac, for the Cmd key.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["web", "webgl2"] }
fastrand = { version = "2.5", features = ["js"] }
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "board_step"
harness = false

[[bench]]
name = "frame_loop"
harness = false

# Bevy runs far too slowly unoptimized, so dependencies are fully optimized even
# in dev builds while this crate keeps fast incremental rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# The web build downloads its module on every visit, so Bevy is optimized for
# size there, while this crate keeps full speed for the simulation.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true

[profile.web-release.package.gol-bevy]
opt-level = 3
