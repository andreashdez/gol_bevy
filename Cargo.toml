[package]
name = "gol-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
accesskit = "0.24"
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "system_clipboard"] }
dirs = "7"
fastrand = "2.5"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "board_step"
harness = false

[[bench]]
name = "dense_crossover"
harness = false

# Bevy runs far too slowly unoptimized, so dependencies are fully optimized even
# in dev builds while this crate keeps fast incremental rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
