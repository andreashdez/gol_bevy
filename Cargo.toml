[package]
name = "gol-bevy"
version = "0.2.0"
edition = "2024"
description = "Conway's Game of Life as a desktop app, built on Bevy"
license = "MIT"
repository = "https://github.com/andreashdez/gol_bevy"
homepage = "https://andreashdez.github.io/gol_bevy/"
# Matches rust-toolchain.toml, for anyone building with another toolchain.
rust-version = "1.100"
# An app, not a library: nothing to publish to crates.io.
publish = false

[dependencies]
accesskit = "0.24"
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "system_clipboard"] }
dirs = "7"
fastrand = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Native file dialogs; the web build has no file system, so it leaves them out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"

# The web build, for the demo on the docs site. `web` gives Bevy browser clocks
# and task executors, and `js` seeds random boards from the browser instead of
# a fixed seed.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["web"] }
fastrand = { version = "2.5", features = ["js"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "board_step"
harness = false

# Bevy runs far too slowly unoptimized, so dependencies are fully optimized even
# in dev builds while this crate keeps fast incremental rebuilds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# The web build downloads its module on every visit, so Bevy is optimized for
# size there, while this crate keeps full speed for the simulation.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true

[profile.web-release.package.gol-bevy]
opt-level = 3
